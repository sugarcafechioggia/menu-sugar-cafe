name: Rigenera PDF del menu

on:
  push:
    branches: [main]
    paths:
      - menu.json
      - print/**
      - assets/**
      - .github/workflows/rigenera-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rigenera-pdf-menu
  cancel-in-progress: true

jobs:
  genera-pdf:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il menu
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installa il generatore PDF
        run: python -m pip install reportlab==4.4.3

      - name: Genera il PDF A4
        run: python print/generate_pdf.py

      - name: Controlla il risultato
        run: |
          test -s menu-sugar-cafe-a4-2-colonne.pdf
          python - <<'PY'
          from pathlib import Path
          pdf = Path('menu-sugar-cafe-a4-2-colonne.pdf')
          assert pdf.read_bytes().startswith(b'%PDF-'), 'Il file generato non è un PDF valido'
          print(f'PDF verificato: {pdf.stat().st_size} byte')
          PY

      - name: Salva il PDF aggiornato
        run: |
          if git diff --quiet -- menu-sugar-cafe-a4-2-colonne.pdf; then
            echo "Il PDF è già aggiornato."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu-sugar-cafe-a4-2-colonne.pdf
          git commit -m "Rigenera PDF del menu"
          git push

      - name: Invia il PDF su Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          TIMESTAMP=$(TZ=Europe/Rome date '+%Y-%m-%d_%H-%M')
          NOME_FILE="menu-sugar-cafe_${TIMESTAMP}.pdf"
          DATA_ORA=$(TZ=Europe/Rome date '+%d/%m/%Y alle %H:%M')
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@menu-sugar-cafe-a4-2-colonne.pdf;type=application/pdf;filename=${NOME_FILE}" \
            -F "caption=Sugar Cafè — menù prodotto il ${DATA_ORA}%0Ahttps://menu.sugarcafe.it"
